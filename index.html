<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Voltaris – Weiterleitung</title>
</head>
<body>
<p id="status">Weiterleitung zu Voltaris …</p>
<p><a id="link" href="http://127.0.0.1:5097/meinbuero">Weiter zu Voltaris</a></p>
<pre id="debug"></pre>
<script>
  // Sucht die OwnershipID in Query und Hash und reicht sie an die lokale Voltaris-Instanz weiter.
  // Rohwert auslesen: URLSearchParams würde ein "+" der Base64-ID zu einem Leerzeichen machen.
  const match = /[?&#]iid=([^&#]*)/.exec(location.search + location.hash);
  const iid = match ? decodeURIComponent(match[1]) : "";
  const target = "http://127.0.0.1:5097/meinbuero" + (iid ? "?iid=" + encodeURIComponent(iid) : "");
  document.getElementById("link").href = target;
  document.getElementById("debug").textContent =
    "Empfangene Adresse: " + location.href + "\nGefundene iid: " + (iid || "(keine)");
  if (iid) {
    location.replace(target);
  } else {
    document.getElementById("status").textContent =
      "Keine OwnershipID (iid) in der Adresse gefunden.";
  }
</script>
</body>
</html>
