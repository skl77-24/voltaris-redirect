<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Voltaris – Weiterleitung</title>
</head>
<body>
<p id="status">Weiterleitung zu Voltaris …</p>
<p><a id="link" href="http://127.0.0.1:5097/meinbuero">Weiter zu Voltaris</a></p>
<pre id="debug"></pre>
<script>
  // Sucht die OwnershipID in Query und Hash und reicht sie an die lokale Voltaris-Instanz weiter.
  const params = new URLSearchParams(location.search);
  const hashParams = new URLSearchParams(location.hash.replace(/^#\/?\??/, ""));
  const iid = params.get("iid") ?? hashParams.get("iid") ?? "";
  const target = new URL("http://127.0.0.1:5097/meinbuero");
  if (iid) target.searchParams.set("iid", iid);
  document.getElementById("link").href = target.toString();
  document.getElementById("debug").textContent =
    "Empfangene Adresse: " + location.href + "\nGefundene iid: " + (iid || "(keine)");
  if (iid) {
    location.replace(target.toString());
  } else {
    document.getElementById("status").textContent =
      "Keine OwnershipID (iid) in der Adresse gefunden.";
  }
</script>
</body>
</html>
